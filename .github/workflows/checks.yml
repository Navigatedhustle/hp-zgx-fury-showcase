name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: bash ops/scan-secrets.sh
      - run: python ops/check-source.py
      - run: python ops/package-release.py --version v3.2.0-nano.2
      - name: Install the same isolated application environment used by the launcher
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --no-deps -r ops/apps-requirements.lock
          .venv/bin/python -m pip check
      - name: Hardware-independent controller and API failure fixtures
        run: .venv/bin/python -m pytest -q ops/tests ops/acceptance/test_gateway.py ops/acceptance/test_booth.py
      # GPU/browser/namespace/model generation acceptance is intentionally separate.
